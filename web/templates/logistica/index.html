{% extends "base.html" %}

{% block title %}Gestión de Logística - EMI{% endblock %}

{% block content %}
<div class="max-w-md mx-auto">
    <div class="mb-6 flex items-center justify-between">
        <div>
            <h2 class="text-xl font-bold text-white">Gestión de Logística</h2>
            <p class="text-slate-400 text-sm">Asignación de equipo y puestos</p>
        </div>
        <a href="{{ prefix }}/logistica/lista" class="text-yellow-400 hover:text-yellow-300 flex flex-col items-center">
            <i class="la la-list text-2xl"></i>
            <span class="text-[10px] font-bold uppercase">Ver Lista</span>
        </a>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const msg = urlParams.get('msg');
        const type = urlParams.get('type');
        if (msg) {
            document.write(`
                <div class="mb-6 p-4 rounded-xl border ${type === 'success' ? 'bg-emerald-500/10 border-emerald-500/50 text-emerald-400' : 'bg-red-500/10 border-red-500/50 text-red-400'} flex items-center gap-3">
                    <i class="la ${type === 'success' ? 'la-check-circle' : 'la-exclamation-circle'} text-xl"></i>
                    <p class="text-sm font-medium">${msg}</p>
                </div>
            `);
        }
    </script>

    <div class="glass p-6 rounded-2xl border border-white/10 shadow-2xl">
        <form id="logisticaForm" action="{{ prefix }}/logistica/crear" method="post" class="space-y-6">
            <!-- ID solo para edición -->
            <div id="id_field" class="hidden">
                <label class="block text-[10px] font-bold text-yellow-500 uppercase mb-1 ml-1 tracking-wider">ID de
                    Registro</label>
                <input type="number" name="id" id="logistica_id"
                    class="w-full bg-slate-900/50 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-yellow-500 font-mono">
            </div>

            <!-- SECCIÓN 1: Responsable y Fecha -->
            <div class="space-y-4">
                <h3 class="text-xs font-bold text-slate-500 uppercase tracking-widest border-b border-white/5 pb-2">
                    Jornada y Responsable</h3>
                <div class="space-y-3">
                    <div>
                        <label class="block text-[10px] font-semibold text-slate-400 uppercase mb-1 ml-1">Capitán de
                            Logística</label>
                        <select name="id_capitan" id="logistica_id_capitan" required
                            class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:border-yellow-500 appearance-none">
                            <option value="">Seleccione al responsable...</option>
                            {% for servidor in servidores %}
                            <option value="{{ servidor.id }}">{{ servidor.nombre }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div>
                        <label class="block text-[10px] font-semibold text-slate-400 uppercase mb-1 ml-1">Fecha del
                            Servicio</label>
                        <input type="date" name="fecha" id="logistica_fecha" required
                            class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-yellow-500 text-center">
                    </div>
                </div>
            </div>

            <!-- SECCIÓN 2: Distribución de Puestos -->
            <div class="space-y-4">
                <h3 class="text-xs font-bold text-slate-500 uppercase tracking-widest border-b border-white/5 pb-2">
                    Asignación de Puestos</h3>
                <div class="space-y-3">
                    <div>
                        <label
                            class="block text-[10px] font-semibold text-slate-400 uppercase mb-1 ml-1">Almacén</label>
                        <select name="id_almacen" id="logistica_id_almacen"
                            class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:border-yellow-500 appearance-none text-sm">
                            <option value="">Sin asignar</option>
                            {% for servidor in servidores %}
                            <option value="{{ servidor.id }}">{{ servidor.nombre }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div>
                        <label class="block text-[10px] font-semibold text-slate-400 uppercase mb-1 ml-1">Distribución
                            Alimentos</label>
                        <select name="id_distribucion" id="logistica_id_distribucion"
                            class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:border-yellow-500 appearance-none text-sm">
                            <option value="">Sin asignar</option>
                            {% for servidor in servidores %}
                            <option value="{{ servidor.id }}">{{ servidor.nombre }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div>
                        <label
                            class="block text-[10px] font-semibold text-slate-400 uppercase mb-1 ml-1">Hidratación</label>
                        <select name="id_hidratacion" id="logistica_id_hidratacion"
                            class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:border-yellow-500 appearance-none text-sm">
                            <option value="">Sin asignar</option>
                            {% for servidor in servidores %}
                            <option value="{{ servidor.id }}">{{ servidor.nombre }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div>
                        <label class="block text-[10px] font-semibold text-slate-400 uppercase mb-1 ml-1">Pasillo /
                            Orden</label>
                        <select name="id_pasillo" id="logistica_id_pasillo"
                            class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:border-yellow-500 appearance-none text-sm">
                            <option value="">Sin asignar</option>
                            {% for servidor in servidores %}
                            <option value="{{ servidor.id }}">{{ servidor.nombre }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div>
                        <label
                            class="block text-[10px] font-semibold text-slate-400 uppercase mb-1 ml-1">Secretaría</label>
                        <select name="id_secretaria" id="logistica_id_secretaria"
                            class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:border-yellow-500 appearance-none text-sm">
                            <option value="">Sin asignar</option>
                            {% for servidor in servidores %}
                            <option value="{{ servidor.id }}">{{ servidor.nombre }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
            </div>

            <!-- SECCIÓN 3: Observaciones -->
            <div class="space-y-4">
                <h3 class="text-xs font-bold text-slate-500 uppercase tracking-widest border-b border-white/5 pb-2">
                    Notas Adicionales</h3>
                <textarea name="observaciones" id="logistica_observaciones" rows="3"
                    class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-yellow-500 text-sm"
                    placeholder="Detalles sobre novedades del equipo..."></textarea>
            </div>

            <!-- Botones de Acción -->
            <div class="flex flex-col gap-3 pt-4">
                <button type="submit" id="btn_submit"
                    class="w-full bg-yellow-600 hover:bg-yellow-500 text-white font-bold py-4 rounded-2xl transition-all active:scale-95 shadow-lg shadow-yellow-600/30 uppercase text-sm tracking-widest">
                    Guardar Logística
                </button>
                <button type="button" onclick="cambiarAModoEdicion()" id="btn_mode"
                    class="w-full bg-slate-700/50 hover:bg-slate-600 text-slate-300 font-bold py-3 rounded-2xl transition-all uppercase text-[10px] tracking-widest border border-slate-700">
                    Cambiar a Modo Edición
                </button>
            </div>
        </form>

        <form id="deleteForm" action="{{ prefix }}/logistica/eliminar" method="post" class="hidden">
            <input type="hidden" name="id" id="delete_id">
            <button type="submit" onclick="return confirm('¿Eliminar registro de logística?')"
                class="w-full bg-red-600/10 hover:bg-red-600 text-red-500 hover:text-white font-bold py-4 rounded-2xl border border-red-500/30 transition-all mt-4 uppercase text-xs tracking-widest">
                Eliminar Registro
            </button>
        </form>
    </div>
</div>

<script>

    function cambiarAModoEdicion() {
        const form = document.getElementById('logisticaForm');
        const idField = document.getElementById('id_field');
        const delForm = document.getElementById('deleteForm');
        const btnSubmit = document.getElementById('btn_submit');

        idField.classList.toggle('hidden');
        delForm.classList.toggle('hidden');

        if (!idField.classList.contains('hidden')) {
            form.action = "{{ prefix }}/logistica/actualizar";
            btnSubmit.innerText = "ACTUALIZAR";
            document.getElementById('btn_mode').innerText = "MODO CREAR";
            document.getElementById('logistica_id').required = true;
            document.getElementById('logistica_id').addEventListener('input', (e) => {
                document.getElementById('delete_id').value = e.target.value;
            });
        } else {
            form.action = "{{ prefix }}/logistica/crear";
            btnSubmit.innerText = "REGISTRAR";
            document.getElementById('btn_mode').innerText = "MODO EDICIÓN";
            document.getElementById('logistica_id').required = false;
        }
    }

    window.onload = function () {
        const editId = urlParams.get('edit_id');
        if (editId) {
            cambiarAModoEdicion();
            document.getElementById('logistica_id').value = editId;
            document.getElementById('delete_id').value = editId;

            // Pre-cargar valores de los selectores si vienen en la URL
            // Nota: En una fase posterior, lo ideal sería obtener los IDs de los servidores reales
            // asignados a cada puesto mediante una consulta AJAX.
            document.getElementById('logistica_id_capitan').value = urlParams.get('capitan_id') || "";
            document.getElementById('logistica_id_almacen').value = urlParams.get('almacen_id') || "";
            document.getElementById('logistica_id_distribucion').value = urlParams.get('distribucion_id') || "";
            document.getElementById('logistica_id_hidratacion').value = urlParams.get('hidratacion_id') || "";
            document.getElementById('logistica_id_pasillo').value = urlParams.get('pasillo_id') || "";
            document.getElementById('logistica_id_secretaria').value = urlParams.get('secretaria_id') || "";
            document.getElementById('logistica_observaciones').value = urlParams.get('obs') || "";

            if (urlParams.get('fecha')) document.getElementById('logistica_fecha').value = urlParams.get('fecha');
        } else {
            document.getElementById('logistica_fecha').valueAsDate = new Date();
        }
    };
</script>
{% endblock %}
