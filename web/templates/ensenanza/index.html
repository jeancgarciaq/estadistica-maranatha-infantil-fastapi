{% extends "base.html" %}

{% block title %}Gestión de Enseñanza - EMI{% endblock %}

{% block content %}
<div class="max-w-md mx-auto">
    <div class="mb-6 flex items-center justify-between">
        <div>
            <h2 class="text-xl font-bold text-white">Gestión de Enseñanza</h2>
            <p class="text-slate-400 text-sm">Registro de capitanes y subcapitanes</p>
        </div>
        <a href="/ensenanza/lista" class="text-lime-400 hover:text-lime-300 flex flex-col items-center">
            <i class="la la-list text-2xl"></i>
            <span class="text-[10px] font-bold uppercase">Ver Lista</span>
        </a>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const msg = urlParams.get('msg');
        const type = urlParams.get('type');
        if (msg) {
            document.write(`
                <div class="mb-6 p-4 rounded-xl border ${type === 'success' ? 'bg-emerald-500/10 border-emerald-500/50 text-emerald-400' : 'bg-red-500/10 border-red-500/50 text-red-400'} flex items-center gap-3">
                    <i class="la ${type === 'success' ? 'la-check-circle' : 'la-exclamation-circle'} text-xl"></i>
                    <p class="text-sm font-medium">${msg}</p>
                </div>
            `);
        }
    </script>

    <div class="glass p-6 rounded-2xl border border-white/10 shadow-2xl">
        <form id="ensenanzaForm" action="/ensenanza/crear" method="post" class="space-y-4">
            <div id="id_field" class="hidden">
                <label class="block text-xs font-semibold text-slate-400 uppercase mb-2 ml-1">ID Enseñanza</label>
                <input type="number" name="id" id="ensenanza_id"
                    class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-lime-500">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-400 uppercase mb-2 ml-1">Capitán</label>
                <input type="text" name="capitan" id="ensenanza_capitan" required
                    class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-lime-500"
                    placeholder="Nombre del capitán">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-400 uppercase mb-2 ml-1">Subcapitanes
                    (Cantidad)</label>
                <input type="number" name="subcapitan" id="ensenanza_subcapitan" required value="0"
                    class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-lime-500">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-400 uppercase mb-2 ml-1">Fecha</label>
                <input type="date" name="fecha" id="ensenanza_fecha" required
                    class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-lime-500">
            </div>

            <div class="grid grid-cols-2 gap-3 pt-4">
                <button type="submit" id="btn_submit"
                    class="bg-lime-600 hover:bg-lime-500 text-white font-bold py-4 rounded-xl transition-all active:scale-95 shadow-lg shadow-lime-600/30 uppercase text-sm">
                    Registrar
                </button>
                <button type="button" onclick="cambiarAModoEdicion()" id="btn_mode"
                    class="bg-slate-700 hover:bg-slate-600 text-white font-bold py-4 rounded-xl transition-all uppercase text-xs">
                    Modo Edición
                </button>
            </div>
        </form>

        <form id="deleteForm" action="/ensenanza/eliminar" method="post" class="hidden">
            <input type="hidden" name="id" id="delete_id">
            <button type="submit" onclick="return confirm('¿Eliminar registro de enseñanza?')"
                class="w-full bg-red-600/20 hover:bg-red-600 text-red-500 hover:text-white font-bold py-3 rounded-xl border border-red-600/50 transition-all mt-2 uppercase text-xs">
                Eliminar Registro
            </button>
        </form>
    </div>
</div>

<script>
    function cambiarAModoEdicion() {
        const form = document.getElementById('ensenanzaForm');
        const idField = document.getElementById('id_field');
        const delForm = document.getElementById('deleteForm');
        const btnSubmit = document.getElementById('btn_submit');

        idField.classList.toggle('hidden');
        delForm.classList.toggle('hidden');

        if (!idField.classList.contains('hidden')) {
            form.action = "/ensenanza/actualizar";
            btnSubmit.innerText = "ACTUALIZAR";
            document.getElementById('btn_mode').innerText = "MODO CREAR";
            document.getElementById('ensenanza_id').required = true;
            document.getElementById('ensenanza_id').addEventListener('input', (e) => {
                document.getElementById('delete_id').value = e.target.value;
            });
        } else {
            form.action = "/ensenanza/crear";
            btnSubmit.innerText = "REGISTRAR";
            document.getElementById('btn_mode').innerText = "MODO EDICIÓN";
            document.getElementById('ensenanza_id').required = false;
        }
    }
    document.getElementById('ensenanza_fecha').valueAsDate = new Date();

    window.onload = function () {
        const urlParams = new URLSearchParams(window.location.search);
        const editId = urlParams.get('edit_id');
        const capitan = urlParams.get('capitan');
        const sub = urlParams.get('sub');
        const fecha = urlParams.get('fecha');

        if (editId) {
            cambiarAModoEdicion();
            document.getElementById('ensenanza_id').value = editId;
            document.getElementById('ensenanza_capitan').value = capitan || "";
            document.getElementById('ensenanza_subcapitan').value = sub || "0";
            if (fecha) document.getElementById('ensenanza_fecha').value = fecha;
        }
    };
</script>
{% endblock %}
