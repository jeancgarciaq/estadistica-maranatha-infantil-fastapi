{% extends "base.html" %}

{% block title %}Gestión de Áreas - EMI{% endblock %}

{% block content %}
<div class="max-w-md mx-auto">
    <div class="mb-6 flex items-center justify-between">
        <div>
            <h2 class="text-xl font-bold text-white">Gestión de Áreas</h2>
            <p class="text-slate-400 text-sm">Crear, actualizar o eliminar áreas</p>
        </div>
        <a href="/areas/lista" class="text-blue-400 hover:text-blue-300 flex flex-col items-center">
            <i class="la la-list text-2xl"></i>
            <span class="text-[10px] font-bold uppercase">Ver Lista</span>
        </a>
    </div>

    <!-- Mensajes de Feedback -->
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const msg = urlParams.get('msg');
        const type = urlParams.get('type');
        if (msg) {
            document.write(`
                <div class="mb-6 p-4 rounded-xl border ${type === 'success' ? 'bg-emerald-500/10 border-emerald-500/50 text-emerald-400' : 'bg-red-500/10 border-red-500/50 text-red-400'} flex items-center gap-3">
                    <i class="la ${type === 'success' ? 'la-check-circle' : 'la-exclamation-circle'} text-xl"></i>
                    <p class="text-sm font-medium">${msg}</p>
                </div>
            `);
        }
    </script>

    <div class="glass p-6 rounded-2xl border border-white/10 space-y-8">
        <!-- Formulario Crear/Actualizar -->
        <form id="areaForm" action="/areas/crear" method="post" class="space-y-4">
            <div id="id_field" class="hidden">
                <label class="block text-xs font-semibold text-slate-400 uppercase mb-2 ml-1">ID del Área (solo para
                    Editar/Eliminar)</label>
                <input type="number" name="id" id="area_id"
                    class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-blue-500">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-400 uppercase mb-2 ml-1">Nombre del Área</label>
                <input type="text" name="nombre" id="area_nombre" required
                    class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-blue-500"
                    placeholder="Ej. Alabanza">
            </div>

            <div class="grid grid-cols-2 gap-3 pt-2">
                <button type="submit" id="btn_submit"
                    class="bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-xl transition-all active:scale-95">
                    CREAR
                </button>
                <button type="button" onclick="cambiarAModoEdicion()" id="btn_mode"
                    class="bg-slate-700 hover:bg-slate-600 text-white font-bold py-3 rounded-xl transition-all">
                    MODO EDICIÓN
                </button>
            </div>
        </form>

        <!-- Botón Eliminar (Solo visible en modo edición) -->
        <form id="deleteForm" action="/areas/eliminar" method="post" class="hidden">
            <input type="hidden" name="id" id="delete_id">
            <button type="submit" onclick="return confirm('¿Está seguro de eliminar esta área?')"
                class="w-full bg-red-600/20 hover:bg-red-600 text-red-500 hover:text-white font-bold py-3 rounded-xl border border-red-600/50 transition-all mt-2">
                ELIMINAR REGISTRO
            </button>
        </form>
    </div>
</div>

<script>
    function cambiarAModoEdicion() {
        const form = document.getElementById('areaForm');
        const idField = document.getElementById('id_field');
        const delForm = document.getElementById('deleteForm');
        const btnSubmit = document.getElementById('btn_submit');
        const btnMode = document.getElementById('btn_mode');

        const esModoEdicion = idField.classList.toggle('hidden') === false;
        delForm.classList.toggle('hidden');

        if (esModoEdicion) {
            form.action = "/areas/actualizar";
            btnSubmit.innerText = "ACTUALIZAR";
            btnMode.innerText = "MODO CREAR";
            document.getElementById('area_id').required = true;
        } else {
            form.action = "/areas/crear";
            btnSubmit.innerText = "CREAR";
            btnMode.innerText = "MODO EDICIÓN";
            document.getElementById('area_id').required = false;
        }
    }

    // Sincronizar ID de eliminación en tiempo real
    document.getElementById('area_id').addEventListener('input', (e) => {
        document.getElementById('delete_id').value = e.target.value;
    });

    // Auto-precarga desde URL si se viene desde la lista
    window.addEventListener('DOMContentLoaded', () => {
        const params = new URLSearchParams(window.location.search);
        if (params.get('id')) {
            document.getElementById('area_id').value = params.get('id');
            document.getElementById('delete_id').value = params.get('id');
            document.getElementById('area_nombre').value = params.get('nombre') || '';
            cambiarAModoEdicion();
        }
    });
</script>
{% endblock %}
