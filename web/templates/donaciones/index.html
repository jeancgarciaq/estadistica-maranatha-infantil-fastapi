{% extends "base.html" %}

{% block title %}Gestión de Donaciones - EMI{% endblock %}

{% block content %}
<div class="max-w-md mx-auto">
    <div class="mb-6 flex items-center justify-between">
        <div>
            <h2 class="text-xl font-bold text-white">Gestión de Donaciones</h2>
            <p class="text-slate-400 text-sm">Registrar, actualizar o eliminar donaciones</p>
        </div>
        <a href="{{ prefix }}/donaciones/lista" class="text-emerald-400 hover:text-emerald-300 flex flex-col items-center">
            <i class="la la-list text-2xl"></i>
            <span class="text-[10px] font-bold uppercase">Ver Lista</span>
        </a>
    </div>

    <!-- Mensajes de Feedback -->
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const msg = urlParams.get('msg');
        const type = urlParams.get('type');
        if (msg) {
            document.write(`
                <div class="mb-6 p-4 rounded-xl border ${type === 'success' ? 'bg-emerald-500/10 border-emerald-500/50 text-emerald-400' : 'bg-red-500/10 border-red-500/50 text-red-400'} flex items-center gap-3">
                    <i class="la ${type === 'success' ? 'la-check-circle' : 'la-exclamation-circle'} text-xl"></i>
                    <p class="text-sm font-medium">${msg}</p>
                </div>
            `);
        }
    </script>

    <div class="glass p-6 rounded-2xl border border-white/10 shadow-2xl">
        <form id="donacionForm" action="{{ prefix }}/donaciones/crear" method="post" class="space-y-4">
            <!-- ID solo para edición -->
            <div id="id_field" class="hidden">
                <label class="block text-xs font-semibold text-slate-400 uppercase mb-2 ml-1">ID Donación</label>
                <input type="number" name="id" id="donacion_id"
                    class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-emerald-500">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-400 uppercase mb-2 ml-1">Descripción</label>
                <input type="text" name="descripcion" id="donacion_descripcion" required
                    class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-emerald-500"
                    placeholder="Ej. Arroz, Frijoles, Juguetes">
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase mb-2 ml-1">Cantidad</label>
                    <input type="number" step="0.01" name="cantidad" id="donacion_cantidad" value="0" required
                        class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-emerald-500 text-center">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase mb-2 ml-1">Medida</label>
                    <select name="unidad" id="donacion_unidad" required
                        class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-3 text-white focus:outline-none focus:border-emerald-500 appearance-none">
                        {% for medida in medidas %}
                        <option value="{{ medida }}" {% if medida=="Unidad(es)" %}selected{% endif %}>{{ medida }}
                        </option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-400 uppercase mb-2 ml-1">Fecha</label>
                <input type="date" name="fecha" id="donacion_fecha" required
                    class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-emerald-500">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-400 uppercase mb-2 ml-1">Equipo</label>
                <input type="text" name="equipo" id="donacion_equipo" required
                    class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-emerald-500"
                    placeholder="Ej. Equipo de Cocina">
            </div>

            <div class="grid grid-cols-2 gap-3 pt-4">
                <button type="submit" id="btn_submit"
                    class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-4 rounded-xl transition-all active:scale-95 shadow-lg shadow-emerald-600/30 uppercase text-sm">
                    CREAR
                </button>
                <button type="button" onclick="cambiarAModoEdicion()" id="btn_mode"
                    class="bg-slate-700 hover:bg-slate-600 text-white font-bold py-4 rounded-xl transition-all uppercase text-xs">
                    Modo Edición
                </button>
            </div>
        </form>

        <form id="deleteForm" action="{{ prefix }}/donaciones/eliminar" method="post" class="hidden">
            <input type="hidden" name="id" id="delete_id">
            <button type="submit" onclick="return confirm('¿Eliminar esta donación?')"
                class="w-full bg-red-600/20 hover:bg-red-600 text-red-500 hover:text-white font-bold py-3 rounded-xl border border-red-600/50 transition-all mt-2 uppercase text-xs">
                Eliminar Registro
            </button>
        </form>
    </div>
</div>

<script>
    function cambiarAModoEdicion() {
        const form = document.getElementById('donacionForm');
        const idField = document.getElementById('id_field');
        const delForm = document.getElementById('deleteForm');
        const btnSubmit = document.getElementById('btn_submit');

        idField.classList.toggle('hidden');
        delForm.classList.toggle('hidden');

        if (!idField.classList.contains('hidden')) {
            form.action = "{{ prefix }}/donaciones/actualizar";
            btnSubmit.innerText = "ACTUALIZAR";
            document.getElementById('btn_mode').innerText = "MODO CREAR";
            document.getElementById('donacion_id').required = true;
            document.getElementById('donacion_id').addEventListener('input', (e) => {
                document.getElementById('delete_id').value = e.target.value;
            });
        } else {
            form.action = "{{ prefix }}/donaciones/crear";
            btnSubmit.innerText = "CREAR";
            document.getElementById('btn_mode').innerText = "MODO EDICIÓN";
            document.getElementById('donacion_id').required = false;
        }
    }
    // Set default date to today
    document.getElementById('donacion_fecha').valueAsDate = new Date();

    // Pre-fill form if ID is present in URL (for editing)
    window.onload = function () {
        const urlParams = new URLSearchParams(window.location.search);
        const editId = urlParams.get('edit_id');

        if (editId) {
            cambiarAModoEdicion(); // Switch to edit mode
            document.getElementById('donacion_id').value = editId;
            document.getElementById('delete_id').value = editId; // Sincronizar ID para el formulario de eliminación
            document.getElementById('donacion_descripcion').value = urlParams.get('descripcion') || '';
            document.getElementById('donacion_cantidad').value = urlParams.get('cantidad') || '0';
            document.getElementById('donacion_unidad').value = urlParams.get('unidad') || 'Unidad(es)';
            document.getElementById('donacion_fecha').value = urlParams.get('fecha') || '';
            document.getElementById('donacion_equipo').value = urlParams.get('equipo') || '';
        }
    };
</script>
{% endblock %}
