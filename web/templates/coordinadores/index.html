{% extends "base.html" %}
{% block title %}Gestión de Coordinadores{% endblock %}
{% block content %}
<div class="max-w-md mx-auto">
    <div class="mb-6 flex items-center justify-between">
        <h2 class="text-xl font-bold text-white">Gestión de Coordinadores</h2>
        <a href="/coordinadores/lista" class="text-amber-400 hover:text-amber-300 flex flex-col items-center">
            <i class="la la-list text-2xl"></i>
            <span class="text-[10px] font-bold uppercase">Ver Lista</span>
        </a>
    </div>

    <div class="glass p-6 rounded-2xl border border-white/10 shadow-2xl">
        <form id="coordinadorForm" action="/coordinadores/crear" method="post" class="space-y-4">
            <!-- ID solo para edición -->
            <div id="id_field" class="hidden">
                <label class="block text-xs font-semibold text-slate-400 uppercase mb-2 ml-1">ID del Coordinador</label>
                <input type="number" name="id" id="coordinador_id"
                    class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-amber-500">
            </div>

            <div class="text-start">
                <label class="block text-xs font-semibold text-slate-400 uppercase mb-2">Nombre del Coordinador</label>
                <input type="text" name="nombre" required
                    class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:border-amber-500 outline-none">
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase mb-2">Cédula</label>
                    <input type="number" name="cedula" required
                        class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:border-amber-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase mb-2">Fecha de Nacimiento</label>
                    <div class="relative">
                        <input type="text" data-visible-date
                            class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:border-amber-500 outline-none"
                            placeholder="DD/MM/YYYY" autocomplete="off" inputmode="numeric">
                        <input type="date" name="fecha_nacimiento" class="hidden fecha-native" aria-hidden="true">
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase mb-2">Edad</label>
                    <input type="number" name="edad" required
                        class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:border-amber-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase mb-2">Celular</label>
                    <input type="text" name="celular" id="coordinador_celular"
                        class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:border-amber-500 outline-none">
                </div>
            </div>

            <div class="text-start">
                <label class="block text-xs font-semibold text-slate-400 uppercase mb-2">Correo</label>
                <input type="email" name="correo" id="coordinador_correo"
                    class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:border-amber-500 outline-none">
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div class="text-start">
                    <label class="block text-xs font-semibold text-slate-400 uppercase mb-2">Líder Asignado</label>
                    <select name="id_lider" required
                        class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:border-amber-500 outline-none appearance-none">
                        <option value="">Seleccione Líder...</option>
                        {% for lider in lideres %}
                        <option value="{{ lider.id }}">{{ lider.nombre }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="text-start">
                    <label class="block text-xs font-semibold text-slate-400 uppercase mb-2">Área Asignada</label>
                    <select name="id_area"
                        class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:border-amber-500 outline-none appearance-none">
                        <option value="">Seleccione Área (Opcional)...</option>
                        {% for area in areas %}
                        <option value="{{ area.id }}">{{ area.area }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <!-- Información Adicional -->
            <div class="border-t border-slate-700/50 pt-4 space-y-4">
                <h3 class="text-sm font-bold text-amber-400 uppercase">Información Adicional</h3>
                
                <div class="grid grid-cols-2 gap-3">
                    <div class="text-start">
                        <label class="block text-xs font-semibold text-slate-400 uppercase mb-2">Sexo</label>
                        <select name="sexo"
                            class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:border-amber-500 outline-none appearance-none">
                            <option value="">Seleccione Sexo...</option>
                            <option value="masculino">Masculino</option>
                            <option value="femenino">Femenino</option>
                        </select>
                    </div>
                    <div class="text-start">
                        <label class="block text-xs font-semibold text-slate-400 uppercase mb-2">Estado Civil</label>
                        <select name="estado_civil"
                            class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:border-amber-500 outline-none appearance-none">
                            <option value="">Seleccione...</option>
                            <option value="soltero">Soltero</option>
                            <option value="casado">Casado</option>
                            <option value="divorciado">Divorciado</option>
                            <option value="viudo">Viudo</option>
                            <option value="concubinato">Concubinato</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div class="text-start">
                        <label class="block text-xs font-semibold text-slate-400 uppercase mb-2">Profesión</label>
                        <input type="text" name="profesion"
                            class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:border-amber-500 outline-none">
                    </div>
                    <div class="text-start">
                        <label class="block text-xs font-semibold text-slate-400 uppercase mb-2">Cantidad de Hijos</label>
                        <input type="number" name="cantidad_hijos" value="0" min="0"
                            class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:border-amber-500 outline-none">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div class="text-start">
                        <label class="block text-xs font-semibold text-slate-400 uppercase mb-2">Equipo / Grupo</label>
                        <input type="number" name="numero_equipo" placeholder="Nro de Equipo"
                            class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:border-amber-500 outline-none">
                    </div>
                    <div class="text-start">
                        <label class="block text-xs font-semibold text-slate-400 uppercase mb-2">Tiempo de Servicio</label>
                        <input type="text" name="tiempo_servicio" placeholder="Ej. 2 años"
                            class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:border-amber-500 outline-none">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div class="text-start">
                        <label class="block text-xs font-semibold text-slate-400 uppercase mb-2">¿Evangelio Cambia?</label>
                        <select name="pertenece_evangelio_cambia"
                            class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:border-amber-500 outline-none appearance-none">
                            <option value="">Seleccione...</option>
                            <option value="si">Sí</option>
                            <option value="no">No</option>
                        </select>
                    </div>
                    <div class="text-start">
                        <label class="block text-xs font-semibold text-slate-400 uppercase mb-2">¿Bautizado?</label>
                        <select name="bautizado"
                            class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:border-amber-500 outline-none appearance-none">
                            <option value="">Seleccione...</option>
                            <option value="si">Sí</option>
                            <option value="no">No</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div class="text-start">
                        <label class="block text-xs font-semibold text-slate-400 uppercase mb-2">¿Asiste Discipulado?</label>
                        <select name="asiste_discipulado"
                            class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:border-amber-500 outline-none appearance-none">
                            <option value="">Seleccione...</option>
                            <option value="si">Sí</option>
                            <option value="no">No</option>
                        </select>
                    </div>
                    <div class="text-start">
                        <label class="block text-xs font-semibold text-slate-400 uppercase mb-2">¿Usa Transporte?</label>
                        <select name="usa_transporte"
                            class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:border-amber-500 outline-none appearance-none">
                            <option value="">Seleccione...</option>
                            <option value="si">Sí</option>
                            <option value="no">No</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div class="text-start">
                        <label class="block text-xs font-semibold text-slate-400 uppercase mb-2">¿Sirve en otra área?</label>
                        <select name="sirve_otra_area" onchange="toggleOtraAreaDetalle(this)"
                            class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:border-amber-500 outline-none appearance-none">
                            <option value="">Seleccione...</option>
                            <option value="si">Sí</option>
                            <option value="no">No</option>
                        </select>
                    </div>
                <div class="text-start hidden" id="otra_area_detalle_div">
                    <label class="block text-xs font-semibold text-slate-400 uppercase mb-2">¿Cuál área?</label>
                    <input type="text" name="otra_area_detalle" placeholder="Área de servicio"
                        class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:border-amber-500 outline-none">
                </div>
            </div>
                <div class="text-start pt-2">
                    <label class="block text-xs font-semibold text-slate-400 uppercase mb-2">¿Ha sido levantado como coordinador/responsable?</label>
                    <select name="levantado"
                        class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:border-amber-500 outline-none appearance-none">
                        <option value="">Seleccione...</option>
                        <option value="si">Sí</option>
                        <option value="no">No</option>
                    </select>
                </div>
                <div class="text-start pt-2">
                    <label class="block text-xs font-semibold text-slate-400 uppercase mb-2">Dirección</label>
                    <textarea name="direccion" rows="3"
                        class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:border-amber-500 outline-none"></textarea>
                </div>
            </div>
        </div>
            </div>

            <div class="grid grid-cols-2 gap-3 pt-4">
                <button type="submit" id="btn_submit"
                    class="bg-amber-600 hover:bg-amber-500 text-white font-bold py-4 rounded-xl transition-all active:scale-95 shadow-lg shadow-amber-600/30 uppercase text-sm">
                    Registrar
                </button>
                <button type="button" onclick="cambiarAModoEdicion()" id="btn_mode"
                    class="bg-slate-700 hover:bg-slate-600 text-white font-bold py-4 rounded-xl transition-all uppercase text-xs">
                    Modo Edición
                </button>
            </div>
        </form>

        <form id="deleteForm" action="/coordinadores/eliminar" method="post" class="hidden">
            <input type="hidden" name="id" id="delete_id">
            <button type="submit" onclick="return confirm('¿Eliminar registro de coordinador?')"
                class="w-full bg-red-600/20 hover:bg-red-600 text-red-500 hover:text-white font-bold py-3 rounded-xl border border-red-600/50 transition-all mt-2 uppercase text-xs">
                Eliminar Registro
            </button>
        </form>
    </div>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);

    function cambiarAModoEdicion() {
        const form = document.getElementById('coordinadorForm');
        const idField = document.getElementById('id_field');
        const delForm = document.getElementById('deleteForm');
        const btnSubmit = document.getElementById('btn_submit');

        idField.classList.toggle('hidden');
        delForm.classList.toggle('hidden');

        if (!idField.classList.contains('hidden')) {
            form.action = "/coordinadores/actualizar";
            btnSubmit.innerText = "ACTUALIZAR";
            document.getElementById('btn_mode').innerText = "MODO CREAR";
            document.getElementById('coordinador_id').required = true;
        } else {
            form.action = "/coordinadores/crear";
            btnSubmit.innerText = "REGISTRAR";
            document.getElementById('btn_mode').innerText = "MODO EDICIÓN";
            document.getElementById('coordinador_id').required = false;
        }
    }

    function toggleOtraAreaDetalle(selectEl) {
        const div = document.getElementById('otra_area_detalle_div');
        if (selectEl && selectEl.value === 'si') {
            div.classList.remove('hidden');
        } else {
            div.classList.add('hidden');
            const input = div.querySelector('input');
            if (input) input.value = '';
        }
    }

    if (urlParams.get('id')) {
        cambiarAModoEdicion();
        document.getElementById('coordinador_id').value = urlParams.get('id');
        document.getElementById('delete_id').value = urlParams.get('id');
        document.querySelector('input[name="nombre"]').value = urlParams.get('nombre') || "";
        document.querySelector('input[name="cedula"]').value = urlParams.get('cedula') || "";
        document.querySelector('input[name="edad"]').value = urlParams.get('edad') || "";
        document.getElementById('coordinador_celular').value = urlParams.get('celular') || "";
        document.getElementById('coordinador_correo').value = urlParams.get('correo') || "";
        document.querySelector('select[name="id_lider"]').value = urlParams.get('id_lider') || "";
        document.querySelector('select[name="id_area"]').value = urlParams.get('id_area') || "";

        // Campos nuevos
        document.querySelector('select[name="sexo"]').value = urlParams.get('sexo') || "";
        document.querySelector('input[name="profesion"]').value = urlParams.get('profesion') || "";
        document.querySelector('select[name="estado_civil"]').value = urlParams.get('estado_civil') || "";
        document.querySelector('input[name="cantidad_hijos"]').value = urlParams.get('cantidad_hijos') || "0";
        document.querySelector('input[name="numero_equipo"]').value = urlParams.get('numero_equipo') || "";
        document.querySelector('input[name="tiempo_servicio"]').value = urlParams.get('tiempo_servicio') || "";
        document.querySelector('select[name="pertenece_evangelio_cambia"]').value = urlParams.get('pertenece_evangelio_cambia') || "";
        document.querySelector('select[name="bautizado"]').value = urlParams.get('bautizado') || "";
        document.querySelector('select[name="asiste_discipulado"]').value = urlParams.get('asiste_discipulado') || "";
        document.querySelector('select[name="usa_transporte"]').value = urlParams.get('usa_transporte') || "";
        document.querySelector('select[name="levantado"]').value = urlParams.get('levantado') || "";
        document.querySelector('textarea[name="direccion"]').value = urlParams.get('direccion') || '';

        const sirveOtraSelect = document.querySelector('select[name="sirve_otra_area"]');
        sirveOtraSelect.value = urlParams.get('sirve_otra_area') || "";
        document.querySelector('input[name="otra_area_detalle"]').value = urlParams.get('otra_area_detalle') || "";
        toggleOtraAreaDetalle(sirveOtraSelect);

        // Cargar fecha de nacimiento si existe
        const fechaNac = urlParams.get('fecha_nacimiento');
        if (fechaNac) {
            const nativeDate = document.querySelector('input[name="fecha_nacimiento"]');
            nativeDate.value = fechaNac;
            const visibleDate = document.querySelector('input[data-visible-date]');
            if (visibleDate) {
                const dt = parseDateFromText(fechaNac);
                if (dt) visibleDate.value = formatToDisplay(dt);
            }
        }
    }

    // --- LÓGICA DE FECHA Y CÁLCULO DE EDAD ---
    function parseDateFromText(text) {
        if (!text) return null;
        text = text.trim();
        const dmy = text.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
        if (dmy) {
            const dd = parseInt(dmy[1], 10);
            const mm = parseInt(dmy[2], 10) - 1;
            const yyyy = parseInt(dmy[3], 10);
            return new Date(yyyy, mm, dd);
        }
        const ymd = text.match(/^(\d{4})-(\d{2})-(\d{2})$/);
        if (ymd) {
            return new Date(parseInt(ymd[1], 10), parseInt(ymd[2], 10) - 1, parseInt(ymd[3], 10));
        }
        return null;
    }

    function formatToDisplay(date) {
        if (!date || isNaN(date.getTime())) return '';
        const dd = String(date.getDate()).padStart(2, '0');
        const mm = String(date.getMonth() + 1).padStart(2, '0');
        const yyyy = date.getFullYear();
        return `${dd}/${mm}/${yyyy}`;
    }

    function formatToISO(date) {
        if (!date || isNaN(date.getTime())) return '';
        const dd = String(date.getDate()).padStart(2, '0');
        const mm = String(date.getMonth() + 1).padStart(2, '0');
        const yyyy = date.getFullYear();
        return `${yyyy}-${mm}-${dd}`;
    }

    function calculateAge(date) {
        if (!date || isNaN(date.getTime())) return null;
        const today = new Date();
        let age = today.getFullYear() - date.getFullYear();
        const m = today.getMonth() - date.getMonth();
        if (m < 0 || (m === 0 && today.getDate() < date.getDate())) age--;
        return age;
    }

    function attachDateHandlers() {
        const v = document.querySelector('input[data-visible-date]');
        const native = document.querySelector('input[name="fecha_nacimiento"]');
        const edadInput = document.querySelector('input[name="edad"]');

        if (native.value) {
            const dt = parseDateFromText(native.value);
            if (dt) v.value = formatToDisplay(dt);
        }

        v.addEventListener('focus', () => {
            try { native.showPicker(); } catch (e) { native.click(); }
        });

        native.addEventListener('change', () => {
            const dt = parseDateFromText(native.value);
            if (dt) {
                v.value = formatToDisplay(dt);
                const age = calculateAge(dt);
                if (age !== null) edadInput.value = age;
            }
        });

        v.addEventListener('blur', () => {
            const dt = parseDateFromText(v.value);
            native.value = dt ? formatToISO(dt) : '';
            if (dt) {
                const age = calculateAge(dt);
                if (age !== null) edadInput.value = age;
            }
        });
    }

    document.addEventListener('DOMContentLoaded', attachDateHandlers);
</script>
{% endblock %}
