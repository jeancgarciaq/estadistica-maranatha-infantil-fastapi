{% extends "base.html" %}

{% block title %}Gestión de Salones - EMI{% endblock %}

{% block content %}
<div class="max-w-md mx-auto">
    <div class="mb-6 flex items-center justify-between">
        <div>
            <h2 class="text-xl font-bold text-white">Gestión de Salones</h2>
            <p class="text-slate-400 text-sm">Administre los salones y sus rangos de edad</p>
        </div>
        <a href="/salones/lista" class="text-sky-400 hover:text-sky-300 flex flex-col items-center">
            <i class="la la-list text-2xl"></i>
            <span class="text-[10px] font-bold uppercase">Ver Lista</span>
        </a>
    </div>

    <!-- Mensajes de Feedback -->
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const msg = urlParams.get('msg');
        const type = urlParams.get('type');
        if (msg) {
            document.write(`
                <div class="mb-6 p-4 rounded-xl border ${type === 'success' ? 'bg-emerald-500/10 border-emerald-500/50 text-emerald-400' : 'bg-red-500/10 border-red-500/50 text-red-400'} flex items-center gap-3">
                    <i class="la ${type === 'success' ? 'la-check-circle' : 'la-exclamation-circle'} text-xl"></i>
                    <p class="text-sm font-medium">${msg}</p>
                </div>
            `);
        }
    </script>

    <div class="glass p-6 rounded-2xl border border-white/10 space-y-8 shadow-2xl">
        <form id="salonForm" action="/salones/crear" method="post" class="space-y-4">
            <div id="id_field" class="hidden">
                <label class="block text-xs font-semibold text-slate-400 uppercase mb-2 ml-1">ID del Salón</label>
                <input type="number" name="id" id="salon_id"
                    class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-sky-500">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-400 uppercase mb-2 ml-1">Nombre del Salón</label>
                <input type="text" name="nombre" id="salon_nombre" required
                    class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-sky-500"
                    placeholder="Ej. Arca de Noé">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-400 uppercase mb-2 ml-1">Rango de Edad</label>
                <input type="text" name="edad" id="salon_edad" required
                    class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-sky-500"
                    placeholder="Ej. 3-5 años">
            </div>

            <div class="grid grid-cols-2 gap-3 pt-2">
                <button type="submit" id="btn_submit"
                    class="bg-sky-600 hover:bg-sky-500 text-white font-bold py-3 rounded-xl transition-all active:scale-95 shadow-lg shadow-sky-600/30">
                    CREAR
                </button>
                <button type="button" onclick="cambiarAModoEdicion()" id="btn_mode"
                    class="bg-slate-700 hover:bg-slate-600 text-white font-bold py-3 rounded-xl transition-all">
                    MODO EDICIÓN
                </button>
            </div>
        </form>

        <form id="deleteForm" action="/salones/eliminar" method="post" class="hidden">
            <input type="hidden" name="id" id="delete_id">
            <button type="submit" onclick="return confirm('¿Está seguro de eliminar este salón?')"
                class="w-full bg-red-600/20 hover:bg-red-600 text-red-500 hover:text-white font-bold py-3 rounded-xl border border-red-600/50 transition-all mt-2">
                ELIMINAR REGISTRO
            </button>
        </form>
    </div>
</div>

<script>
    function cambiarAModoEdicion() {
        const form = document.getElementById('salonForm');
        const idField = document.getElementById('id_field');
        const delForm = document.getElementById('deleteForm');
        const btnSubmit = document.getElementById('btn_submit');

        idField.classList.toggle('hidden');
        delForm.classList.toggle('hidden');

        if (!idField.classList.contains('hidden')) {
            form.action = "/salones/actualizar";
            btnSubmit.innerText = "ACTUALIZAR";
            btnSubmit.className = "bg-sky-600 hover:bg-sky-500 text-white font-bold py-3 rounded-xl transition-all active:scale-95 shadow-lg shadow-sky-600/30";
            document.getElementById('btn_mode').innerText = "MODO CREAR";
            document.getElementById('salon_id').required = true;
            document.getElementById('salon_id').addEventListener('input', (e) => {
                document.getElementById('delete_id').value = e.target.value;
            });
        } else {
            form.action = "/salones/crear";
            btnSubmit.innerText = "CREAR";
            document.getElementById('btn_mode').innerText = "MODO EDICIÓN";
            document.getElementById('salon_id').required = false;
        }
    }
</script>
{% endblock %}
