{% extends "base.html" %}

{% block title %}Gestión de Aulas - EMI{% endblock %}

{% block content %}
<div class="max-w-md mx-auto">
    <div class="mb-6 flex items-center justify-between">
        <div>
            <h2 class="text-xl font-bold text-white">Gestión de Aulas</h2>
            <p class="text-slate-400 text-sm">Registro de asistencia y servidores</p>
        </div>
        <a href="/aulas/lista" class="text-orange-400 hover:text-orange-300 flex flex-col items-center">
            <i class="la la-list text-2xl"></i>
            <span class="text-[10px] font-bold uppercase">Ver Lista</span>
        </a>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const msg = urlParams.get('msg');
        const type = urlParams.get('type');
        if (msg) {
            document.write(`
                <div class="mb-6 p-4 rounded-xl border ${type === 'success' ? 'bg-emerald-500/10 border-emerald-500/50 text-emerald-400' : 'bg-red-500/10 border-red-500/50 text-red-400'} flex items-center gap-3">
                    <i class="la ${type === 'success' ? 'la-check-circle' : 'la-exclamation-circle'} text-xl"></i>
                    <p class="text-sm font-medium">${msg}</p>
                </div>
            `);
        }
    </script>

    <div class="glass p-6 rounded-2xl border border-white/10 shadow-2xl">
        <form id="aulaForm" action="/aulas/crear" method="post" class="space-y-4">
            <!-- ID solo para edición -->
            <div id="id_field" class="hidden">
                <label class="block text-xs font-semibold text-slate-400 uppercase mb-2 ml-1">ID del Aula</label>
                <input type="number" name="id" id="aula_id"
                    class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-orange-500">
            </div>

            <!-- Salón y Fecha -->
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase mb-2 ml-1">Salón</label>
                    <select name="id_salon" id="aula_id_salon" required
                        class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-3 text-white focus:outline-none focus:border-orange-500 appearance-none">
                        <option value="">Seleccione...</option>
                        {% for salon in salones %}
                        <option value="{{ salon.id }}">{{ salon.salon }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase mb-2 ml-1">Fecha</label>
                    <input type="date" name="fecha" id="aula_fecha" required
                        class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-orange-500">
                </div>
            </div>

            <!-- Personal (Maestra, Auxiliar, Capitán) -->
            <div class="grid grid-cols-3 gap-3">
                <div>
                    <label class="block text-[10px] font-semibold text-slate-400 uppercase mb-2">Maestra</label>
                    <input type="number" name="maestra" id="aula_maestra" value="0" required
                        class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-3 text-white focus:outline-none focus:border-orange-500 text-center">
                </div>
                <div>
                    <label class="block text-[10px] font-semibold text-slate-400 uppercase mb-2">Auxiliar</label>
                    <input type="number" name="auxiliar" id="aula_auxiliar" value="0" required
                        class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-3 text-white focus:outline-none focus:border-orange-500 text-center">
                </div>
                <div>
                    <label class="block text-[10px] font-semibold text-slate-400 uppercase mb-2">Capitán</label>
                    <input type="number" name="capitan" id="aula_capitan" value="0" required
                        class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-3 text-white focus:outline-none focus:border-orange-500 text-center">
                </div>
            </div>

            <!-- Personal (Subcapitán, Colaborador) -->
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-[10px] font-semibold text-slate-400 uppercase mb-2">Subcapitán</label>
                    <input type="number" name="subcapitan" id="aula_subcapitan" value="0" required
                        class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-3 text-white focus:outline-none focus:border-orange-500 text-center">
                </div>
                <div>
                    <label class="block text-[10px] font-semibold text-slate-400 uppercase mb-2">Colaborador</label>
                    <input type="number" name="colaborador" id="aula_colaborador" value="0" required
                        class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-3 text-white focus:outline-none focus:border-orange-500 text-center">
                </div>
            </div>

            <!-- Niños y Niñas -->
            <div class="grid grid-cols-2 gap-3">
                <div class="bg-blue-500/10 p-3 rounded-xl border border-blue-500/20">
                    <label class="block text-[10px] font-bold text-blue-400 uppercase mb-2 text-center">Niños</label>
                    <input type="number" name="ninos" id="aula_ninos" value="0" required
                        class="w-full bg-slate-900/50 border border-slate-700 rounded-lg px-2 py-2 text-white focus:outline-none focus:border-blue-500 text-center font-bold">
                </div>
                <div class="bg-rose-500/10 p-3 rounded-xl border border-rose-500/20">
                    <label class="block text-[10px] font-bold text-rose-400 uppercase mb-2 text-center">Niñas</label>
                    <input type="number" name="ninas" id="aula_ninas" value="0" required
                        class="w-full bg-slate-900/50 border border-slate-700 rounded-lg px-2 py-2 text-white focus:outline-none focus:border-rose-500 text-center font-bold">
                </div>
            </div>

            <!-- Condición -->
            <div>
                <label class="block text-xs font-semibold text-slate-400 uppercase mb-2 ml-1">Condición</label>
                <select name="condicion" id="aula_condicion" required
                    class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-orange-500 appearance-none">
                    <option value="Abierto" selected>Abierto</option>
                    <option value="Cerrado">Cerrado</option>
                </select>
            </div>

            <div class="grid grid-cols-2 gap-3 pt-4">
                <button type="submit" id="btn_submit"
                    class="bg-orange-600 hover:bg-orange-500 text-white font-bold py-4 rounded-xl transition-all active:scale-95 shadow-lg shadow-orange-600/30 uppercase text-sm">
                    Registrar
                </button>
                <button type="button" onclick="cambiarAModoEdicion()" id="btn_mode"
                    class="bg-slate-700 hover:bg-slate-600 text-white font-bold py-4 rounded-xl transition-all uppercase text-xs">
                    Modo Edición
                </button>
            </div>
        </form>

        <form id="deleteForm" action="/aulas/eliminar" method="post" class="hidden">
            <input type="hidden" name="id" id="delete_id">
            <button type="submit" onclick="return confirm('¿Eliminar registro de aula?')"
                class="w-full bg-red-600/20 hover:bg-red-600 text-red-500 hover:text-white font-bold py-3 rounded-xl border border-red-600/50 transition-all mt-2 uppercase text-xs">
                Eliminar Registro
            </button>
        </form>
    </div>
</div>

<script>
    function actualizarCondicion() {
        const fields = [
            'aula_maestra', 'aula_auxiliar', 'aula_capitan',
            'aula_subcapitan', 'aula_colaborador', 'aula_ninos', 'aula_ninas'
        ];
        let total = 0;
        fields.forEach(id => {
            total += parseInt(document.getElementById(id).value) || 0;
        });

        const condSelect = document.getElementById('aula_condicion');
        if (total > 0) {
            condSelect.value = "Abierto";
        } else {
            condSelect.value = "Cerrado";
        }
    }

    function cambiarAModoEdicion() {
        const form = document.getElementById('aulaForm');
        const idField = document.getElementById('id_field');
        const delForm = document.getElementById('deleteForm');
        const btnSubmit = document.getElementById('btn_submit');

        idField.classList.toggle('hidden');
        delForm.classList.toggle('hidden');

        if (!idField.classList.contains('hidden')) {
            form.action = "/aulas/actualizar";
            btnSubmit.innerText = "ACTUALIZAR";
            document.getElementById('btn_mode').innerText = "MODO CREAR";
            document.getElementById('aula_id').required = true;
            document.getElementById('aula_id').addEventListener('input', (e) => {
                document.getElementById('delete_id').value = e.target.value;
            });
        } else {
            form.action = "/aulas/crear";
            btnSubmit.innerText = "REGISTRAR";
            document.getElementById('btn_mode').innerText = "MODO EDICIÓN";
            document.getElementById('aula_id').required = false;
        }
    }

    // Cargar datos desde URL si existen (viniendo de la lista de aulas para editar)
    if (urlParams.get('id')) {
        if (document.getElementById('id_field').classList.contains('hidden')) {
            cambiarAModoEdicion();
        }
        document.getElementById('aula_id').value = urlParams.get('id');
        document.getElementById('delete_id').value = urlParams.get('id');
        document.getElementById('aula_id_salon').value = urlParams.get('id_salon') || "";
        document.getElementById('aula_fecha').value = urlParams.get('fecha') || "";
        document.getElementById('aula_maestra').value = urlParams.get('maestra') || 0;
        document.getElementById('aula_auxiliar').value = urlParams.get('auxiliar') || 0;
        document.getElementById('aula_capitan').value = urlParams.get('capitan') || 0;
        document.getElementById('aula_subcapitan').value = urlParams.get('subcapitan') || 0;
        document.getElementById('aula_colaborador').value = urlParams.get('colaborador') || 0;
        document.getElementById('aula_ninos').value = urlParams.get('ninos') || 0;
        document.getElementById('aula_ninas').value = urlParams.get('ninas') || 0;
        document.getElementById('aula_condicion').value = urlParams.get('condicion') || "Abierto";
    } else {
        // Solo poner fecha de hoy si no estamos editando un registro existente
        document.getElementById('aula_fecha').valueAsDate = new Date();
    }

    // Vincular detectores de eventos para actualizar la condición automáticamente
    [
        'aula_maestra', 'aula_auxiliar', 'aula_capitan',
        'aula_subcapitan', 'aula_colaborador', 'aula_ninos', 'aula_ninas'
    ].forEach(id => {
        document.getElementById(id).addEventListener('input', actualizarCondicion);
    });
    actualizarCondicion(); // Ejecutar al cargar para validar estado inicial
</script>
{% endblock %}
