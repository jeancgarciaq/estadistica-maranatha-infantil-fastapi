{% extends "base.html" %}
{% block title %}Gestión de Pastores{% endblock %}
{% block content %}
<div class="max-w-md mx-auto">
    <div class="mb-6 flex items-center justify-between">
        <h2 class="text-xl font-bold text-white">Gestión de Pastores</h2>
        <a href="/pastores/lista" class="text-amber-400 hover:text-amber-300 flex flex-col items-center">
            <i class="la la-list text-2xl"></i>
            <span class="text-[10px] font-bold uppercase">Ver Lista</span>
        </a>
    </div>

    <div class="glass p-6 rounded-2xl border border-white/10 shadow-2xl">
        <form action="/pastores/crear" method="post" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-400 uppercase mb-2">Nombre del Pastor</label>
                <input type="text" name="nombre" required
                    class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:border-amber-500 outline-none">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-400 uppercase mb-2">Iglesia / Congregación</label>
                <input type="text" name="iglesia" required
                    class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:border-amber-500 outline-none">
            </div>

            <button type="submit"
                class="w-full bg-amber-600 hover:bg-amber-500 text-white font-bold py-4 rounded-xl transition-all shadow-lg shadow-amber-600/20 uppercase text-sm">
                Registrar Pastor
            </button>
        </form>
    </div>
</div>
{% endblock %}
