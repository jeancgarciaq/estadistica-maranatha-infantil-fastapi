{% extends "base.html" %}

{% block title %}Gestión de Servidores{% endblock %}

{% block content %}
<div class="container mx-auto p-4 max-w-6xl">
    <div class="flex justify-between items-center mb-6">
        <div>
            <h2 class="text-2xl font-bold text-green-400"><i class="la la-id-badge mr-2"></i>Gestión de Servidores</h2>
            <p class="text-xs text-slate-500">Administración de personal de servicio</p>
        </div>
        <div class="flex gap-2">
            <button onclick="toggleFiltros()"
                class="bg-slate-700 hover:bg-slate-600 p-2 px-4 rounded-lg font-bold flex items-center gap-2 transition-all text-sm">
                <i class="la la-filter text-xl"></i> Filtros
            </button>
            <button onclick="document.getElementById('modalCrearServidor').classList.remove('hidden')"
                class="bg-blue-600 hover:bg-blue-700 p-2 px-4 rounded-lg font-bold flex items-center gap-2 transition-all text-sm">
                <i class="la la-plus text-xl"></i> Nuevo Servidor
            </button>
        </div>
    </div>

    <!-- Formulario de Filtros -->
    <div id="filtros-container" class="hidden glass rounded-xl border border-slate-700 p-4 mb-6">
        <form id="form-filtros" class="grid grid-cols-1 md:grid-cols-4 gap-4">
            <input type="text" name="nombre" placeholder="Buscar por Nombre"
                class="bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm outline-none text-white">
            <input type="number" name="cedula" placeholder="Buscar por Cédula"
                class="bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm outline-none text-white">
            <input type="text" name="area_servicio" placeholder="Área de Servicio"
                class="bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm outline-none text-white">
            <div class="grid grid-cols-2 gap-2">
                <select name="mes_nacimiento"
                    class="bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm outline-none text-white">
                    <option value="">Mes Cumpleaños</option>
                    {% for i in range(1, 13) %}<option value="{{ i }}">{{ i }}</option>{% endfor %}
                </select>
                <input type="number" name="dia_nacimiento" placeholder="Día" min="1" max="31"
                    class="bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm outline-none text-white">
            </div>
            <div class="md:col-span-4 flex justify-end gap-2 mt-2">
                <button type="button" onclick="exportarPDF()"
                    class="bg-red-600/20 text-red-400 border border-red-500/30 hover:bg-red-600 hover:text-white p-2 px-4 rounded-lg font-bold transition-all text-sm">
                    <i class="la la-file-pdf"></i> Exportar PDF
                </button>
                <button type="submit"
                    class="bg-green-600 hover:bg-green-700 p-2 px-6 rounded-lg font-bold transition-all text-sm text-white">
                    Filtrar Lista
                </button>
            </div>
        </form>
    </div>

    <!-- Alertas de Feedback -->
    <div id="alert-container" class="mb-4"></div>

    <!-- Contenedor de la Lista -->
    <div class="glass rounded-xl overflow-hidden border border-slate-700">
        <div id="contenedor-lista-servidores">
            <div class="text-center py-5">
                <i class="la la-spinner la-spin text-4xl text-blue-400"></i>
                <p class="mt-2 text-slate-400">Cargando lista de servidores...</p>
            </div>
        </div>
    </div>
</div>

<!-- Modal para Crear Servidor -->
<div id="modalCrearServidor"
    class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-[100] flex items-center justify-center p-4">
    <div class="bg-slate-800 border border-slate-700 w-full max-w-2xl rounded-2xl shadow-2xl">
        <form action="/servidores/crear" method="POST" class="p-0 m-0">
            <div class="p-6 border-b border-slate-700 flex justify-between items-center">
                <h5 class="text-xl font-bold text-blue-400">Registrar Nuevo Servidor</h5>
                <button type="button" onclick="document.getElementById('modalCrearServidor').classList.add('hidden')"
                    class="text-slate-400 hover:text-white">
                    <i class="la la-times text-2xl"></i>
                </button>
            </div>
            <div class="p-6">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="md:col-span-2">
                        <label class="block text-sm font-medium mb-1 text-slate-400">Nombre Completo</label>
                        <input type="text" name="nombre"
                            class="w-full p-2 bg-slate-900 border border-slate-700 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"
                            required maxlength="100">
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1 text-slate-400">Cédula / ID</label>
                        <input type="number" name="cedula"
                            class="w-full p-2 bg-slate-900 border border-slate-700 rounded-lg outline-none" required>
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1 text-slate-400">Fecha de Nacimiento</label>
                        <div class="relative">
                            <input type="text" data-visible-date
                                class="w-full p-2 bg-slate-900 border border-slate-700 rounded-lg outline-none text-white"
                                placeholder="DD/MM/YYYY" autocomplete="off">
                            <input type="date" name="fecha_nacimiento" class="hidden fecha-native" aria-hidden="true">
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1 text-slate-400">Edad</label>
                        <input type="number" name="edad"
                            class="w-full p-2 bg-slate-900 border border-slate-700 rounded-lg outline-none" required
                            min="1">
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1 text-slate-400">Celular</label>
                        <input type="text" name="celular"
                            class="w-full p-2 bg-slate-900 border border-slate-700 rounded-lg outline-none"
                            maxlength="20">
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1 text-slate-400">Correo Electrónico</label>
                        <input type="email" name="correo"
                            class="w-full p-2 bg-slate-900 border border-slate-700 rounded-lg outline-none"
                            maxlength="100">
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1 text-slate-400">Área de Servicio</label>
                        <input type="text" name="area_servicio"
                            class="w-full p-2 bg-slate-900 border border-slate-700 rounded-lg outline-none"
                            maxlength="100">
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1 text-slate-400">Capitán Responsable</label>
                        <input type="text" name="capitan"
                            class="w-full p-2 bg-slate-900 border border-slate-700 rounded-lg outline-none"
                            maxlength="100">
                    </div>
                </div>
            </div>
            <div class="p-6 border-t border-slate-700 flex gap-3">
                <button type="button" onclick="document.getElementById('modalCrearServidor').classList.add('hidden')"
                    class="flex-1 bg-slate-700 hover:bg-slate-600 p-2 rounded-lg font-bold">Cancelar</button>
                <button type="submit" class="flex-1 bg-blue-600 hover:bg-blue-700 p-2 rounded-lg font-bold">Guardar
                    Servidor</button>
            </div>
        </form>
    </div>
</div>

{% endblock %}

{% block scripts %}
<script>
    function cargarLista(params = "") {
        const url = params ? `/servidores/lista?${params}` : '/servidores/lista';
        document.getElementById('contenedor-lista-servidores').innerHTML = `
            <div class="text-center py-5">
                <i class="la la-spinner la-spin text-4xl text-blue-400"></i>
                <p class="mt-2 text-slate-400">Buscando...</p>
            </div>`;
        fetch(url)
            .then(response => response.text())
            .then(html => {
                document.getElementById('contenedor-lista-servidores').innerHTML = html;
            })
            .catch(error => {
                console.error('Error cargando lista:', error);
                document.getElementById('contenedor-lista-servidores').innerHTML =
                    '<div class="m-4 rounded-xl border border-red-500/40 bg-red-500/10 px-4 py-3 text-sm text-red-300">Error al cargar la lista de servidores.</div>';
            });
    }

    function toggleFiltros() {
        document.getElementById('filtros-container').classList.toggle('hidden');
    }

    function exportarPDF() {
        const formData = new FormData(document.getElementById('form-filtros'));
        const params = new URLSearchParams();
        for (const [key, value] of formData.entries()) {
            if (value) params.append(key, value);
        }
        params.append("formato", "pdf");
        window.location.href = `/servidores/exportar?${params.toString()}`;
    }

    document.addEventListener('DOMContentLoaded', function () {
        cargarLista();

        // Manejo de mensajes de URL
        const urlParams = new URLSearchParams(window.location.search);
        const msg = urlParams.get('msg');
        const type = urlParams.get('type') || 'info';
        if (msg) {
            const toneClasses = type === 'error'
                ? 'border-red-500/40 bg-red-500/10 text-red-300'
                : type === 'success'
                    ? 'border-emerald-500/40 bg-emerald-500/10 text-emerald-300'
                    : 'border-blue-500/40 bg-blue-500/10 text-blue-300';
            const alertHtml = `
                <div class="rounded-xl border px-4 py-3 text-sm flex items-center justify-between gap-3 ${toneClasses}">
                    <span>${msg}</span>
                    <button type="button" class="text-slate-300 hover:text-white" aria-label="Cerrar" onclick="this.closest('div').remove()">
                        <i class="la la-times"></i>
                    </button>
                </div>`;
            document.getElementById('alert-container').innerHTML = alertHtml;
        }

        document.getElementById('form-filtros').addEventListener('submit', function (e) {
            e.preventDefault();
            const formData = new FormData(this);
            const params = new URLSearchParams(formData);
            cargarLista(params.toString());
        });
    });
</script>
<script>
    // Utilities para manejo de fecha DD/MM/YYYY y cálculo de edad
    function parseDateFromText(text) {
        if (!text) return null;
        text = text.trim();
        // DD/MM/YYYY
        const dmy = text.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
        if (dmy) {
            const dd = parseInt(dmy[1], 10);
            const mm = parseInt(dmy[2], 10) - 1;
            const yyyy = parseInt(dmy[3], 10);
            const dt = new Date(yyyy, mm, dd);
            return isNaN(dt.getTime()) ? null : dt;
        }
        // YYYY-MM-DD
        const ymd = text.match(/^(\d{4})-(\d{2})-(\d{2})$/);
        if (ymd) {
            const yyyy = parseInt(ymd[1], 10);
            const mm = parseInt(ymd[2], 10) - 1;
            const dd = parseInt(ymd[3], 10);
            const dt = new Date(yyyy, mm, dd);
            return isNaN(dt.getTime()) ? null : dt;
        }
        return null;
    }

    function formatToDisplay(date) {
        if (!date) return '';
        const dd = String(date.getDate()).padStart(2, '0');
        const mm = String(date.getMonth() + 1).padStart(2, '0');
        const yyyy = date.getFullYear();
        return `${dd}/${mm}/${yyyy}`;
    }

    function formatToISO(date) {
        if (!date) return '';
        const dd = String(date.getDate()).padStart(2, '0');
        const mm = String(date.getMonth() + 1).padStart(2, '0');
        const yyyy = date.getFullYear();
        return `${yyyy}-${mm}-${dd}`;
    }

    function calculateAge(date) {
        if (!date) return null;
        const today = new Date();
        let age = today.getFullYear() - date.getFullYear();
        const m = today.getMonth() - date.getMonth();
        if (m < 0 || (m === 0 && today.getDate() < date.getDate())) {
            age--;
        }
        return age;
    }

    function attachDateHandlers(root = document) {
        const visibles = root.querySelectorAll('input[data-visible-date]');
        visibles.forEach(v => {
            // avoid attaching twice
            if (v._dateAttached) return;
            v._dateAttached = true;
            const form = v.closest('form');
            // find the native date input in the same wrapper or form
            let native = v.parentElement.querySelector('input[type="date"]');
            if (!native && form) native = form.querySelector('input[type="date"][name="fecha_nacimiento"]');

            // initialize visible value from native if present
            if (native && native.value) {
                const dt = parseDateFromText(native.value);
                if (dt) v.value = formatToDisplay(dt);
                const edadInput = form && form.querySelector('input[name="edad"]');
                if (edadInput) {
                    const age = calculateAge(dt);
                    if (age !== null && !isNaN(age)) edadInput.value = age;
                }
            }

            // when user focuses the visible input, open native picker to help mobile users
            if (native) {
                v.addEventListener('focus', () => {
                    try { native.showPicker && native.showPicker(); } catch (e) {};
                    // fallback: trigger click
                    try { native.click(); } catch (e) {};
                });

                native.addEventListener('change', () => {
                    const dt = parseDateFromText(native.value);
                    if (dt) v.value = formatToDisplay(dt);
                    const edadInput = form && form.querySelector('input[name="edad"]');
                    if (edadInput) {
                        const age = calculateAge(dt);
                        if (age !== null && !isNaN(age)) edadInput.value = age;
                    }
                });
            }

            // when user types a date in visible input, parse on blur and update native and edad
            v.addEventListener('blur', () => {
                const dt = parseDateFromText(v.value) || null;
                if (native) native.value = dt ? formatToISO(dt) : '';
                const edadInput = form && form.querySelector('input[name="edad"]');
                if (edadInput) {
                    const age = dt ? calculateAge(dt) : '';
                    edadInput.value = (age !== null && !isNaN(age)) ? age : '';
                }
            });
        });
    }

    // hook cargarLista to re-attach handlers after fetch
    const _orig_cargarLista = window.cargarLista;
    window.cargarLista = function (params = "") {
        const url = params ? `/servidores/lista?${params}` : '/servidores/lista';
        document.getElementById('contenedor-lista-servidores').innerHTML = `
            <div class="text-center py-5">
                <i class="la la-spinner la-spin text-4xl text-blue-400"></i>
                <p class="mt-2 text-slate-400">Buscando...</p>
            </div>`;
        fetch(url)
            .then(response => response.text())
            .then(html => {
                document.getElementById('contenedor-lista-servidores').innerHTML = html;
                // attach date handlers to newly injected html
                attachDateHandlers(document.getElementById('contenedor-lista-servidores'));
            })
            .catch(error => {
                console.error('Error cargando lista:', error);
                document.getElementById('contenedor-lista-servidores').innerHTML =
                    '<div class="m-4 rounded-xl border border-red-500/40 bg-red-500/10 px-4 py-3 text-sm text-red-300">Error al cargar la lista de servidores.</div>';
            });
    };

    // attach handlers once DOM ready for create form
    document.addEventListener('DOMContentLoaded', function () {
        attachDateHandlers(document);
    });
</script>
{% endblock %}
