version: '3.8'

services:
  web:
    build: .
    container_name: emi_app
    ports:
      - "8000:8000"
    volumes:
      # Persistencia para la base de datos SQLite local
      - ./models:/app/models
    # environment:
    #   - DATABASE_URL=postgresql://postgres:postgres_password@db:5432/emi_db
    env_file:
      - .env
    restart: always

