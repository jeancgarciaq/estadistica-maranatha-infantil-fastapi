; passenger_wsgi.ini - Configuración para cPanel Python App
; COLOCAR EN: Raíz de la aplicación (mismo nivel que main_web.py)

[passenger]
; Configuración básica
app_type = asgi
startup_file = passenger_wsgi.py
app_module = app

; Puerto - cPanel lo asigna automáticamente, pero podemos definir uno por defecto
; El puerto real se pasa via variable de entorno PASSENGER_APP_PORT
port = 8555

; Procesos y threads
; En plan Starter, mantener bajo para no exceder límites
min_instances = 1
max_instances = 2
max_requests_per_instance = 1000

; Timeouts
startup_timeout = 90
shutdown_timeout = 30

; Logs
log_level = 2
log_file = passenger.log

; Entorno
environment = production
python = python3

; Variables de entorno adicionales
; DATABASE_URL, SMTP_*, etc. se configuran en cPanel Python App → Environment Variables

; Preloader (ahorra memoria en múltiples instancias)
preload_app = true

; Health check
health_check_uri = /dashboard